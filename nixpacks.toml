[phases.setup]
nixPkgs = ["python312", "gcc"]

[phases.install]
cmds = [
  "python3 -m venv /opt/venv",
  "/opt/venv/bin/pip install --upgrade pip",
  "/opt/venv/bin/pip install -r backend/requirements.txt"
]

[phases.build]
cmds = [
  "cd backend && /opt/venv/bin/python manage.py collectstatic --noinput",
  "cd backend && /opt/venv/bin/python manage.py migrate --noinput"
]

[start]
cmd = "cd backend && /opt/venv/bin/gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120"
